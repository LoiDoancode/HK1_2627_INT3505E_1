openapi: 3.0.3
info:
  title: Hotel Booking API
  description: RESTful API cho quản lý đặt phòng khách sạn theo tài liệu Res_and_ep.md và sơ đồ ERD.
  version: 1.0.0

servers:
  - url: https://api.hotelbooking.vn/v1
    description: Production server
  - url: http://localhost:5000/api/v1
    description: Development local server

paths:
  # Nhóm Hotels & Sub-resources
  /hotels:
    $ref: "./paths/hotels/hotels.yaml"
  /hotels/{hotel_id}:
    $ref: "./paths/hotels/hotel_detail.yaml"
  /hotels/{hotel_id}/room-types:
    $ref: "./paths/hotels/room_types.yaml"
  /hotels/{hotel_id}/room-types/{room_type_id}:
    $ref: "./paths/hotels/room_type_detail.yaml"
  /hotels/{hotel_id}/rooms:
    $ref: "./paths/hotels/rooms.yaml"
  /hotels/{hotel_id}/rooms/{room_id}:
    $ref: "./paths/hotels/room_detail.yaml"

  # Nhóm Customers
  /customers:
    $ref: "./paths/customers/customers.yaml"
  /customers/{customer_id}:
    $ref: "./paths/customers/customer_detail.yaml"

  # Nhóm Bookings & Sub-resources
  /bookings:
    $ref: "./paths/bookings/bookings.yaml"
  /bookings/{booking_id}:
    $ref: "./paths/bookings/booking_detail.yaml"
  /bookings/{booking_id}/items:
    $ref: "./paths/bookings/items.yaml"
  /bookings/{booking_id}/items/{item_id}:
    $ref: "./paths/bookings/item_detail.yaml"
  /bookings/{booking_id}/payment:
    $ref: "./paths/bookings/payment.yaml"

components:
  schemas:
    Hotel:
      $ref: "./components/schemas/hotel.yaml"
    RoomType:
      $ref: "./components/schemas/room_type.yaml"
    Room:
      $ref: "./components/schemas/room.yaml"
    Customer:
      $ref: "./components/schemas/customer.yaml"
    Booking:
      $ref: "./components/schemas/booking.yaml"
    BookingItem:
      $ref: "./components/schemas/booking_item.yaml"
    Payment:
      $ref: "./components/schemas/payment.yaml"
    Error:
      $ref: "./components/schemas/error.yaml"

  responses:
    BadRequest:
      $ref: "./components/responses/400_bad_request.yaml"
    Unauthorized:
      $ref: "./components/responses/401_unauthorized.yaml"
    Forbidden:
      $ref: "./components/responses/403_forbidden.yaml"
    NotFound:
      $ref: "./components/responses/404_not_found.yaml"
    Conflict:
      $ref: "./components/responses/409_conflict.yaml"
    UnprocessableEntity:
      $ref: "./components/responses/422_unprocessable_entity.yaml"
    InternalServerError:
      $ref: "./components/responses/500_internal_error.yaml"
