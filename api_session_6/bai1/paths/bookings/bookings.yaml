get:
  summary: Danh sách đơn đặt phòng
  tags:
    - Bookings
  parameters:
    - name: customer_id
      in: query
      schema:
        type: string
    - name: hotel_id
      in: query
      schema:
        type: string
    - name: status
      in: query
      schema:
        type: string
        enum: ["pending", "confirmed", "checked_in", "completed", "cancelled"]
    - name: limit
      in: query
      schema:
        type: integer
        default: 20
  responses:
    "200":
      description: Danh sách đơn booking
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: "../../components/schemas/booking.yaml"
    "400":
      $ref: "../../components/responses/400_bad_request.yaml"

post:
  summary: Tạo mới một đơn đặt phòng
  tags:
    - Bookings
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/booking.yaml"
  responses:
    "201":
      description: Tạo đơn đặt phòng thành công
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/booking.yaml"
    "400":
      $ref: "../../components/responses/400_bad_request.yaml"
