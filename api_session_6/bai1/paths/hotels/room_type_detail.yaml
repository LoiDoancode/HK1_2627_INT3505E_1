get:
  summary: Xem chi tiết hạng phòng
  tags:
    - RoomTypes
  parameters:
    - name: hotel_id
      in: path
      required: true
      schema:
        type: string
    - name: room_type_id
      in: path
      required: true
      schema:
        type: string
  responses:
    "200":
      description: Chi tiết hạng phòng
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/room_type.yaml"
    "404":
      $ref: "../../components/responses/404_not_found.yaml"

patch:
  summary: Cập nhật giá hoặc tiện ích hạng phòng
  tags:
    - RoomTypes
  parameters:
    - name: hotel_id
      in: path
      required: true
      schema:
        type: string
    - name: room_type_id
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/room_type.yaml"
  responses:
    "200":
      description: Cập nhật thành công
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/room_type.yaml"
    "404":
      $ref: "../../components/responses/404_not_found.yaml"
