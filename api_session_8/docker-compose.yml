# ==========================================
# Docker Compose Stack cho Backend Service (Slide 39)
# Tự động khởi tạo database PostgreSQL và service API
# Khởi động chỉ bằng lệnh: docker compose up --build
# ==========================================

services:
  db:
    image: postgres:16-alpine
    container_name: product_order_db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: devpw
      POSTGRES_DB: appdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  api:
    build: .
    container_name: product_order_api
    environment:
      DB_URL: postgresql+psycopg2://app:devpw@db:5432/appdb
      SECRET_KEY: production-secure-secret-key-soa-2026
      LOG_LEVEL: INFO
      PORT: 5000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    restart: unless-stopped

volumes:
  pgdata:

